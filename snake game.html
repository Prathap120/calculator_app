<!DOCTYPE html>
<html>
<head>
    <title>Snake Game</title>

    <style>
        body {
            text-align: center;
            font-family: Arial;
            background-color: black;
            color: white;
        }

        canvas {
            background-color: white;
            border: 3px solid green;
        }

        button {
            margin-top: 15px;
            padding: 10px 20px;
            font-size: 18px;
        }
    </style>
</head>

<body>

    <h1>🐍 Snake Game</h1>

    <h2>Score: <span id="score">0</span></h2>

    <canvas id="game" width="400" height="400"></canvas>

    <br>

    <button onclick="restart()">Restart</button>

    <script>
        let canvas = document.getElementById("game");
        let ctx = canvas.getContext("2d");

        let snake = [
            {x: 200, y: 200},
            {x: 190, y: 200},
            {x: 180, y: 200}
        ];

        let food = {
            x: 300,
            y: 300
        };

        let dx = 10;
        let dy = 0;
        let score = 0;

        document.addEventListener("keydown", changeDirection);

        function game() {

            if (gameOver()) {
                alert("Game Over! Score: " + score);
                return;
            }

            ctx.fillStyle = "white";
            ctx.fillRect(0, 0, 400, 400);

            drawFood();
            moveSnake();
            drawSnake();

            setTimeout(game, 100);
        }

        function drawSnake() {
            for (let i = 0; i < snake.length; i++) {
                ctx.fillStyle = "green";
                ctx.fillRect(snake[i].x, snake[i].y, 10, 10);
            }
        }

        function drawFood() {
            ctx.fillStyle = "red";
            ctx.fillRect(food.x, food.y, 10, 10);
        }

        function moveSnake() {

            let head = {
                x: snake[0].x + dx,
                y: snake[0].y + dy
            };

            snake.unshift(head);

            if (head.x == food.x && head.y == food.y) {
                score++;
                document.getElementById("score").innerHTML = score;

                food.x = Math.floor(Math.random() * 40) * 10;
                food.y = Math.floor(Math.random() * 40) * 10;
            } else {
                snake.pop();
            }
        }

        function changeDirection(event) {

            if (event.key == "ArrowUp" && dy == 0) {
                dx = 0;
                dy = -10;
            }

            if (event.key == "ArrowDown" && dy == 0) {
                dx = 0;
                dy = 10;
            }

            if (event.key == "ArrowLeft" && dx == 0) {
                dx = -10;
                dy = 0;
            }

            if (event.key == "ArrowRight" && dx == 0) {
                dx = 10;
                dy = 0;
            }
        }

        function gameOver() {

            let head = snake[0];

            if (
                head.x < 0 ||
                head.x >= 400 ||
                head.y < 0 ||
                head.y >= 400
            ) {
                return true;
            }

            for (let i = 1; i < snake.length; i++) {
                if (
                    head.x == snake[i].x &&
                    head.y == snake[i].y
                ) {
                    return true;
                }
            }

            return false;
        }

        function restart() {

            snake = [
                {x: 200, y: 200},
                {x: 190, y: 200},
                {x: 180, y: 200}
            ];

            dx = 10;
            dy = 0;
            score = 0;

            document.getElementById("score").innerHTML = score;

            game();
        }

        game();
    </script>

</body>
</html>
